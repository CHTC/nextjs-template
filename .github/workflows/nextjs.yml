# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Run every night
  schedule:
    - cron: '0 6,12,18 * * *'

  pull_request:
    branches: ['main']

  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Update Submodules
        run: git submodule update --init --recursive --remote
      - name: Install pnpm
        # Version comes from the packageManager field in package.json, so CI
        # and developers run the same pnpm. They have to: pnpm 10 and 11 write
        # incompatible patchedDependencies entries into the lockfile, and the
        # mismatch fails the frozen install here.
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      # The Next.js build cache also holds the fetch data cache, which the
      # scheduled builds refresh. actions/cache skips the save on an exact key
      # hit, so the key has to miss every run or those responses are thrown
      # away: github.run_id never repeats, and restore-keys supplies the
      # previous run's cache.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      # next-image-export-optimizer decides what to reuse from the hashes
      # file, so restoring the generated variants without it re-encodes
      # everything. next.config.mjs changes what gets generated, so it belongs
      # in the key.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            public/images/**/nextImageExportOptimizer
            public/images/next-image-export-optimizer-hashes.json
          key: ${{ runner.os }}-next-image-export-optimizer-${{ hashFiles('next.config.mjs') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-next-image-export-optimizer-${{ hashFiles('next.config.mjs') }}-
            ${{ runner.os }}-next-image-export-optimizer-
      - name: Build with Next.js
        run: |
          pnpm run build
          find ./out | sed -e "s/[^-][^\/]*\//  |/g" -e "s/|\([^ ]\)/|-\1/"
          printenv
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Check every link in the built site; the job fails if any are broken.
  # Only links within the site are checked: external sites go down and
  # rate-limit often enough that checking them would fail PRs for nothing.
  # Those are external-links.yml's job.
  #
  # Root-relative links resolve against the root of the export, so this
  # assumes NEXT_PUBLIC_BASE_PATH is empty.
  link-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      SITE_ROOT: ${{ github.workspace }}/_site
    steps:
      - name: Download built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages
      - name: Extract built site
        run: |
          mkdir -p "$SITE_ROOT"
          tar -xf artifact.tar -C "$SITE_ROOT"
      # The org's other GitHub Pages repositories are served as project sites
      # under the same host (/docs/, /security/, ...), so root-relative links
      # into them are valid but absent from this build. Those are excluded by
      # name, unless this site has a top-level path of the same name, which
      # would shadow the project site anyway.
      - name: List sibling Pages sites
        id: siblings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh api --paginate "orgs/${{ github.repository_owner }}/repos?per_page=100" \
              -q '.[] | select(.has_pages) | .name' \
            | while read -r name; do [ -e "$SITE_ROOT/$name" ] || printf '%s\n' "$name"; done \
            | sed 's/[.]/\\./g' | paste -sd'|' -)
          echo "pattern=^file://.*/_site/(${names})([/?#]|\$)" >> "$GITHUB_OUTPUT"
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --no-progress
            --root-dir '${{ env.SITE_ROOT }}'
            --index-files index.html
            --fallback-extensions html
            --exclude '${{ steps.siblings.outputs.pattern }}'
            '${{ env.SITE_ROOT }}/**/*.html'

  # Deployment job if you are serving from GitHub Pages
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref =='refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deployment job if you are serving from an artifact server
  # This will happen automatically after a delay but this hook can be used to trigger it immediately
  # Make sure to replace <host> with the actual host URL
  deploy-artifact-server:
    if: github.event_name != 'pull_request' && github.ref =='refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    env:
      HOSTNAME: ${{ vars.HOSTNAME }}
    steps:
      - name: Hit Web Hook
        run: |
          curl -X 'POST' \
            "${HOSTNAME}/api/api/hooks/release-download-toggle" \
            -H 'accept: application/json' \
            -d ''
